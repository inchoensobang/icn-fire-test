<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인천소방 SOP 뷰어</title>
<style>
body{margin:0;background:#f3f5f8;font-family:Arial,'맑은 고딕',sans-serif;color:#111}
header{background:#0d47a1;color:white;text-align:center;padding:18px;font-size:26px;font-weight:bold}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:white;border-radius:14px;padding:18px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
h2{color:#0d47a1;margin-top:0}
.search{width:100%;box-sizing:border-box;font-size:18px;padding:14px;border:1px solid #bbb;border-radius:10px;margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:12px 4px;gap:10px}
.sop-title{font-size:17px;line-height:1.4}
.sop-num{color:#d50000;font-weight:bold;margin-right:6px}
button{background:#0d47a1;color:white;border:0;border-radius:8px;padding:9px 14px;font-size:15px;font-weight:bold}
.viewer{display:none}
.viewer img{width:100%;max-width:900px;display:block;margin:14px auto;background:white}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.back{float:right}
.small{color:#666;text-align:center;font-size:14px}
</style>
</head>
<body>

<header>🚒 인천소방 SOP 뷰어</header>

<main>
  <section id="list" class="card">
    <h2>🔥 화재대응 SOP 200~243</h2>
    <input id="search" class="search" placeholder="SOP 번호 또는 제목 검색 예: 208, 호스, 특수현상">
    <div id="sopList"></div>
  </section>

  <section id="viewer" class="card viewer">
    <button class="back" onclick="showList()">← 목록</button>
    <h2 id="viewerTitle"></h2>
    <div class="nav">
      <button onclick="prevPage()">◀ 이전</button>
      <strong id="pageInfo">1 / 1</strong>
      <button onclick="nextPage()">다음 ▶</button>
    </div>
    <img id="sopImage" alt="SOP 이미지">
    <p class="small">이미지를 누르면 크게 볼 수 있습니다.</p>
  </section>
</main>

<script src="sopData.js"></script>
<script>
let current = null;
let currentPage = 1;

function renderList(){
  const keyword = document.getElementById('search').value.trim().toLowerCase();
  const box = document.getElementById('sopList');
  box.innerHTML = '';

  SOP200
    .filter(item =>
      item.num.includes(keyword) ||
      item.title.toLowerCase().includes(keyword)
    )
    .forEach(item => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <div class="sop-title">
          <span class="sop-num">SOP${item.num}</span>${item.title}
        </div>
        <button onclick="openSop('${item.num}')">보기</button>
      `;
      box.appendChild(row);
    });
}

function openSop(num){
  current = SOP200.find(item => item.num === num);
  currentPage = 1;
  document.getElementById('list').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  updateViewer();
}

function updateViewer(){
  document.getElementById('viewerTitle').textContent = `SOP${current.num} ${current.title}`;
  document.getElementById('pageInfo').textContent = `${currentPage} / ${current.pages}`;
  const path = `pdf/200/${current.folder}/${currentPage}.jpg`;
  document.getElementById('sopImage').src = path;
}

function prevPage(){
  if(!current) return;
  if(currentPage > 1){
    currentPage--;
    updateViewer();
  }
}

function nextPage(){
  if(!current) return;
  if(currentPage < current.pages){
    currentPage++;
    updateViewer();
  }
}

function showList(){
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('list').style.display = 'block';
}

document.getElementById('search').addEventListener('input', renderList);
document.getElementById('sopImage').addEventListener('click', () => {
  if(document.getElementById('sopImage').src){
    window.open(document.getElementById('sopImage').src, '_blank');
  }
});

renderList();
</script>

</body>
</html>
